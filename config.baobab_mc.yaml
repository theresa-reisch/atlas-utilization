# ============================================================================
# ATLAS Open Data Pipeline — Configuration
# ============================================================================
#
# Baobab (UNIGE) MC config: 2024r-pp MC, output on Baobab BeeGFS scratch.
# Submit with: bash submit_slurm_baobab.sh  (generic defaults live in config.yaml)
# All paths are defined once in the `paths` block and reused via YAML anchors.
# At runtime the pipeline creates a timestamped directory under base_output_dir:
#
#   {base_output_dir}/{run_name}_{YYYYMMDD_HHMMSS}/
#     ├── parsed_data/            ← ROOT files with particle arrays
#     ├── im_arrays/              ← invariant-mass .npy files
#     ├── im_arrays_processed/    ← post-processed (peak-removed) arrays
#     ├── histograms/             ← final ROOT histograms
#     ├── plots/                  ← summary plots
#     ├── logs/                   ← job logs
#     └── metadata_cache.json     ← cached ATLAS file URLs
#
# Quick start:
#   Local test:   python main.py                          (uses defaults below)
#   Cluster:      NUM_JOBS=4 bash submit.sh               (reads this config)
#   Dry run:      python main.py --dry-run                (validates config)

# ===PATH CONFIGURATION=======================================================
# Change base_output_dir to point at a storage volume for cluster runs.
# The per-stage paths below are defaults; they get overridden at runtime
# to sit inside the timestamped run directory.
paths:
  parsed_data_path:        &parsed_data_path        "./output/parsed_data"
  im_arrays_path:          &im_arrays_path          "./output/im_arrays"
  im_arrays_processed_path: &im_arrays_processed_path "./output/im_arrays_processed"
  histograms_path:         &histograms_path         "./output/histograms"
  metadata_cache_path:     &metadata_cache_path     "./output/metadata_cache.json"
  jobs_logs_path:          &jobs_logs_path          "./output/logs"

# ===NAMES====================================================================
names:
  run_name:           &run_name           "atlas_mc_2024r-pp"
  histogram_filename: &histogram_filename "atlas_opendata_mc_bumpnet.root"

# ===RUN METADATA=============================================================
run_metadata:
  run_name: *run_name
  base_output_dir: "/srv/beegfs/scratch/users/r/reisch/resonex/output"   # Baobab (UNIGE) scratch
  batch_job_index: null                  # set by submit.sh (--batch-job-index)
  total_batch_jobs: null                 # set by submit.sh (--total-batch-jobs)

# ===TASK TOGGLES=============================================================
# Enable / disable pipeline stages.  Stages run in order:
#   parsing → mass_calculating → post_processing → histogram_creation
tasks:
  do_parsing: true
  do_mass_calculating: true
  do_post_processing: true
  do_histogram_creation: true

# ===SINGLE-LEPTON TRIGGER SELECTION==========================================
# When enabled, events must have at least one offline-quality lepton
# (surviving kinematic and isolation cuts) that is trigger-matched.
trigger_config:
  enabled: true

# ===TESTING==================================================================
testing_config:
  is_on: false
  test_run_index: null
  testing_jobs_path: "./testing_jobs"
  limit_files_per_year: null             # limit per release-year (for testing)
  limit_combinations: null               # limit IM combinations  (for testing)

# ===MC EVENT WEIGHTING=======================================================
# Normalizes simulated (MC) samples to a target integrated luminosity via:
#   w = (cross_section_pb * 1000 * kFactor * genFiltEff * L) / sumOfWeights
# Cross section, k-factor, filter efficiency and sum-of-weights come from the
# per-dataset ATLAS metadata; only the target luminosity L is set here.
mc_weighting_config:
  enabled: true                          # apply MC weights to simulated samples
  # When enabled, set exactly one of target_luminosity_fb / luminosity_by_campaign
  # (both or neither is an error).
  target_luminosity_fb: null             # single target luminosity in fb^-1 for every dataset
  # Per-campaign luminosity instead of target_luminosity_fb.
  # Each dataset's campaign is read from its events' MC run number
  # (284500 = mc20a, 300000 = mc20d, 310000 = mc20e, 410000 = mc21a). A dataset
  # whose campaign cannot be determined or is not listed is an error. Example Run-2 values:
  # luminosity_by_campaign:
  #   mc20a: 36.2
  #   mc20d: 44.3
  #   mc20e: 58.5
  # 2024r-pp = 2015+2016 data (3.24 + 33.40 fb^-1, legacy Run-2 calibration) <-> mc20a.
  # Any other campaign in the MC aborts the run instead of being mis-normalized.
  luminosity_by_campaign:
    mc20a: 36.6
  # Also multiply each MC event by its nominal pileup weight (PHYSLITE
  # EventInfoAuxDyn.PileupWeight_NOSYS). sumOfWeights is not affected.
  use_pileup_weight: true

# ============================================================================
# STAGE CONFIGURATIONS
# ============================================================================

# --- 1. Parsing --------------------------------------------------------------
# Downloads ATLAS Open Data ROOT files and extracts particle arrays.
parsing_task_config:
  # Default thresholds
  enable_overlap_removal: true
  # Or override one threshold
  # overlap_removal:
  #   e_mu_dr: 0.05      # tighter than default 0.1
  #   e_jet_dr: 0.3      # wider than default 0.2

  # ===PATHS===
  output_path:    *parsed_data_path
  file_urls_path: *metadata_cache_path
  jobs_logs_path: *jobs_logs_path

  # ===DATA SELECTION===
  release_years:
    - "2024r-pp"                         # with parse_mc: true this selects the "2024r-pp_mc" (mc20_13TeV) files
  specific_record_ids: null              # list of CERN record IDs, or null for all
  parse_mc: true

  # ===PERFORMANCE===
  use_multiprocessing: true
  parallel_processes: 4
  threads: 8
  env_threshold_memory_mb: 8000
  chunk_yield_threshold_bytes:  2147483648  # 2 GB
  count_retries_failed_files: 3
  fetching_metadata_timeout: 60
  max_files_to_process: 500              # per release key; null = all files
  enable_jet_tagging: true              # when true, split Jets into BJets/LJets. Must give thresholds for btagging discriminants!
  jet_btagging_thresholds:
    btagDeepFlavB: 0.5
    DL1d: 2.51

  # ===ROOT TREES===
  possible_data_tree_names:
    - "CollectionTree"
    - "mini"
    - "analysis"
    - "Events"
  create_dirs: true
  show_progress_bar: true

  # ===EVENT FILTERING===
  particle_counts:
    electrons: { min: 0, max: 4 }
    muons:     { min: 0, max: 4 }
    jets:      { min: 0, max: 4 }
    bjets:     { min: 0, max: 4 }

  kinematic_cuts:
    electrons: { pt_min: 25000.0, eta_max: 2.47, rel_isolation_max: 0.06 }
    muons:     { pt_min: 25000.0, eta_max: 2.5, rel_isolation_max: 0.06 }
    jets:      { pt_min: 30000.0, eta_max: 2.5 }
    bjets:     { pt_min: 30000.0, eta_max: 2.5 }
    photons:   { pt_min: 25000.0, eta_max: 2.37 }
    taus:      { pt_min: 20000.0, eta_max: 2.5 }

# --- 2. Mass Calculation -----------------------------------------------------
# Computes invariant masses for every valid particle combination per final state.
mass_calculation_task_config:
  # ===PATHS===
  input_dir:  *parsed_data_path          # must be relative: absolute paths are not redirected into the run dir
  output_dir: *im_arrays_path

  # ===PROCESSING===
  field_to_slice_by: "pt"
  use_multiprocessing: true
  parallel_processes: 4
  fs_chunk_threshold_bytes: 2000000000  # 2 GB

  # ===COMBINATORICS===
  objects_to_calculate: [Electrons, Muons, Jets, BJets] # , Photons, Taus
  min_particles_in_combination: 1        # one type is enough; total objects must still be >= 2
  max_particles_in_combination: 4        # maximum distinct particle types in a combination
  min_count_particle_in_combination: 1   # min count per type
  max_count_particle_in_combination: 4   # max count per type was 4
  max_total_particles_in_combination: 4
  min_events_per_fs: 1000                # drop final states with fewer events
  include_subleading: true        # set true to include e1, j1, etc.
  max_subleading_index: 1          # highest rank index to consider

  # ===MASS RESOLUTION===
  # Per-event sigma_m from public per-object pT resolutions (Open Data MC truth,
  # data/MC scale from the Z peak); stored next to each mass as the _sigm sibling.
  mass_resolution:
    enabled: true
    table: null                          # null = resources/resolution/object_resolution_2024r-pp_v1.json
    apply_data_mc_scale: true

# --- 3. Post-Processing ------------------------------------------------------
# Removes known-mass peaks and splits into main / outlier arrays.
post_processing_task_config:
  # ===PATHS===
  input_dir:  *im_arrays_path
  output_dir: *im_arrays_processed_path

  # ===PROCESSING===
  peak_detection_bin_width_gev: 10.0 
  z_peak_cutoff: 110.0   # GeV; drop dilepton masses below this to cut the Z peak (0 disables)
  max_mass_cutoff: 10000.0   # GeV (10 TeV); drop masses above this in every channel (0 disables)
  enable_peak_removal: false # rightmost-highest-peak cut; disabled: found the max per batch, not per final state, and dropped bins before the peak

# --- 4. Histogram Creation ---------------------------------------------------
# Builds ROOT histograms from processed invariant-mass arrays.
histogram_creation_task_config:
  # ===PATHS===
  input_dir:  *im_arrays_processed_path
  output_dir: *histograms_path

  # ===PROCESSING===
  bin_width_gev: 1.0                     # fine base grid for the resolution rebinning

  # ===OUTPUT===
  single_output_file: true
  output_filename: *histogram_filename
  exclude_outliers: false # keep the high-mass tail; the rebin step ends the binning at min_tail_events
  use_bumpnet_naming: true               # mass_<combo>_cat_<final_state> format
  apply_peak_removal_at_histogram_level: false
  trim_empty_bins: false                 # slice each histogram to its first..last non-empty bin (after hadd in batch runs)

  # ===RESOLUTION REBINNING INPUTS===
  resolution_profile_bin_width_gev: 10.0   # RESO_ profile of sigma_m vs mass; null = off
  process_groups:                        # PROC_<group>_ histograms for the rebin ROI overrides (MC only)
    top:                                 # ttbar + single top (2024r-pp Open Data DSIDs)
      [410470, 410471, 411233, 411234, 411316, 410644, 410645, 410658, 410659,
       600017, 600018, 600019, 600020, 601352, 601355, 601624, 601627, 601628,
       601631, 601761, 601762, 601763, 601764]
    ztautau:                             # Sherpa Z -> tautau
      [700360, 700792, 700793, 700794, 700901, 700902, 700903]

# --- Resolution rebinning (after the merge) ----------------------------------
# Mirrors WLCG rebinStackHistograms.py: bin width = sigma_m(m)/rho from a GPR
# fit of the RESO_ profile; ROI from the maximum, ee/mumu above 106.18 GeV, top
# (1l+1j) start >= 175 GeV, e+mu Z->tautau start at the maximum above 80 GeV.
# Needs histograms with bin_width_gev = base_bin_width_gev.
# Writes histograms/<output_filename> with rebinned_<name> and ROI_<name>.
rebin_config:
  enabled: true
  mode: fit                              # fit: derive + save binning; cached: reuse binning_dir (e.g. data)
  base_bin_width_gev: 1.0
  binning_dir: null                      # null = <run_dir>/rebin
  output_filename: rebinned.root
  rho: 1.0                               # bin width = sigma_m / rho
  min_tail_events: 1.0                   # binning ends where < 1 expected background event lies above
